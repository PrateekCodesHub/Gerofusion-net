<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title { font-size: 26px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 15px; font-weight: 500; fill: #64748b; }
      .block-title { font-size: 16px; font-weight: 800; fill: #0f172a; }
      .block-desc { font-size: 12.5px; font-weight: 500; fill: #334155; line-height: 1.4; }
      .dim-badge { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .tag-lbl { font-size: 11px; font-weight: 700; fill: #0284c7; letter-spacing: 0.5px; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1920" height="800" fill="#f8fafc" />
  <rect x="0" y="0" width="1920" height="6" fill="#0284c7" />

  <!-- Header -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" class="title">Fig. 2. GeriatricNet Convolutional Backbone Architecture</text>
    <text x="0" y="28" class="subtitle">Custom Lightweight Deep CNN with Hierarchical Feature Maps, Depthwise Separable Bottleneck, and Global Average Pooling Head</text>
  </g>

    <!-- Stage 1 -->
    <g filter="url(#cardShadow)">
      <rect x="60" y="130" width="250" height="500" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
      <rect x="60" y="130" width="8" height="500" rx="4" fill="#0284c7"/>
    </g>
    <text x="85" y="162" class="tag-lbl" fill="#0284c7">Input Stage</text>
    <text x="85" y="188" class="block-title">Input Image</text>
    <line x1="85" y1="202" x2="285" y2="202" stroke="#f1f5f9" stroke-width="2"/>
        <text x="85" y="232" class="block-desc">• 224 × 224 × 3 RGB Tensor</text><text x="85" y="258" class="block-desc">• Normalized to [0, 1]</text><text x="85" y="284" class="block-desc">• Patient Posture &amp; Facial Cues</text><text x="85" y="310" class="block-desc">• Batch Size: 32</text>
    <rect x="85" y="578" width="200" height="32" rx="8" fill="#0284c7"/>
    <text x="185.0" y="599" text-anchor="middle" class="dim-badge">224 × 224 × 3</text>
        
    <line x1="310" y1="380.0" x2="352" y2="380.0" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>
            
    <!-- Stage 2 -->
    <g filter="url(#cardShadow)">
      <rect x="360" y="130" width="260" height="500" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
      <rect x="360" y="130" width="8" height="500" rx="4" fill="#0284c7"/>
    </g>
    <text x="385" y="162" class="tag-lbl" fill="#0284c7">Hierarchical Block 1</text>
    <text x="385" y="188" class="block-title">Low-Level Edges</text>
    <line x1="385" y1="202" x2="595" y2="202" stroke="#f1f5f9" stroke-width="2"/>
        <text x="385" y="232" class="block-desc">• Conv2D (32 filters, 3×3)</text><text x="385" y="258" class="block-desc">• Batch Normalization</text><text x="385" y="284" class="block-desc">• ReLU Activation</text><text x="385" y="310" class="block-desc">• Conv2D (32 filters, 3×3)</text><text x="385" y="336" class="block-desc">• Batch Normalization + ReLU</text><text x="385" y="362" class="block-desc">• MaxPool (2×2, stride 2)</text><text x="385" y="388" class="block-desc">───</text><text x="385" y="414" class="block-desc">Boundary &amp; Contour Focus</text>
    <rect x="385" y="578" width="210" height="32" rx="8" fill="#0284c7"/>
    <text x="490.0" y="599" text-anchor="middle" class="dim-badge">112 × 112 × 32</text>
        
    <line x1="620" y1="380.0" x2="662" y2="380.0" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>
            
    <!-- Stage 3 -->
    <g filter="url(#cardShadow)">
      <rect x="670" y="130" width="260" height="500" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
      <rect x="670" y="130" width="8" height="500" rx="4" fill="#0284c7"/>
    </g>
    <text x="695" y="162" class="tag-lbl" fill="#0284c7">Hierarchical Block 2</text>
    <text x="695" y="188" class="block-title">Texture & Patterns</text>
    <line x1="695" y1="202" x2="905" y2="202" stroke="#f1f5f9" stroke-width="2"/>
        <text x="695" y="232" class="block-desc">• Conv2D (64 filters, 3×3)</text><text x="695" y="258" class="block-desc">• Batch Normalization</text><text x="695" y="284" class="block-desc">• ReLU Activation</text><text x="695" y="310" class="block-desc">• Conv2D (64 filters, 3×3)</text><text x="695" y="336" class="block-desc">• Batch Normalization + ReLU</text><text x="695" y="362" class="block-desc">• MaxPool (2×2, stride 2)</text><text x="695" y="388" class="block-desc">• Spatial Dropout (0.20)</text><text x="695" y="414" class="block-desc">───</text><text x="695" y="440" class="block-desc">Facial &amp; Muscle Textures</text>
    <rect x="695" y="578" width="210" height="32" rx="8" fill="#0284c7"/>
    <text x="800.0" y="599" text-anchor="middle" class="dim-badge">56 × 56 × 64</text>
        
    <line x1="930" y1="380.0" x2="972" y2="380.0" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>
            
    <!-- Stage 4 -->
    <g filter="url(#cardShadow)">
      <rect x="980" y="130" width="260" height="500" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
      <rect x="980" y="130" width="8" height="500" rx="4" fill="#0284c7"/>
    </g>
    <text x="1005" y="162" class="tag-lbl" fill="#0284c7">Hierarchical Block 3</text>
    <text x="1005" y="188" class="block-title">Semantic Motifs</text>
    <line x1="1005" y1="202" x2="1215" y2="202" stroke="#f1f5f9" stroke-width="2"/>
        <text x="1005" y="232" class="block-desc">• Conv2D (128 filters, 3×3)</text><text x="1005" y="258" class="block-desc">• Batch Normalization</text><text x="1005" y="284" class="block-desc">• ReLU Activation</text><text x="1005" y="310" class="block-desc">• Conv2D (128 filters, 3×3)</text><text x="1005" y="336" class="block-desc">• Batch Normalization + ReLU</text><text x="1005" y="362" class="block-desc">• MaxPool (2×2, stride 2)</text><text x="1005" y="388" class="block-desc">───</text><text x="1005" y="414" class="block-desc">Postural Slouch &amp; Asymmetry</text>
    <rect x="1005" y="578" width="210" height="32" rx="8" fill="#0284c7"/>
    <text x="1110.0" y="599" text-anchor="middle" class="dim-badge">28 × 28 × 128</text>
        
    <line x1="1240" y1="380.0" x2="1282" y2="380.0" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>
            
    <!-- Stage 5 -->
    <g filter="url(#cardShadow)">
      <rect x="1290" y="130" width="270" height="500" rx="14" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
      <rect x="1290" y="130" width="8" height="500" rx="4" fill="#0369a1"/>
    </g>
    <text x="1315" y="162" class="tag-lbl" fill="#0369a1">Lightweight Bottleneck</text>
    <text x="1315" y="188" class="block-title">Depthwise Separable</text>
    <line x1="1315" y1="202" x2="1535" y2="202" stroke="#f1f5f9" stroke-width="2"/>
        <text x="1315" y="232" class="block-desc">• Conv2D (256 filters, 3×3) + BN</text><text x="1315" y="258" class="block-desc">• DepthwiseConv2D (3×3)</text><text x="1315" y="284" class="block-desc">  (Spatial per-channel filter)</text><text x="1315" y="310" class="block-desc">• PointwiseConv2D (1×1, 256)</text><text x="1315" y="336" class="block-desc">  (Cross-channel projection)</text><text x="1315" y="362" class="block-desc">• Factorized Ratio R ≈ 1/K²</text><text x="1315" y="388" class="block-desc">• MaxPool (2×2, stride 2)</text><text x="1315" y="414" class="block-desc">───</text><text x="1315" y="440" class="block-desc">8% Size of ResNet50</text>
    <rect x="1315" y="578" width="220" height="32" rx="8" fill="#0369a1"/>
    <text x="1425.0" y="599" text-anchor="middle" class="dim-badge">14 × 14 × 256</text>
        
    <line x1="1560" y1="380.0" x2="1602" y2="380.0" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>
            
    <!-- Stage 6 -->
    <g filter="url(#cardShadow)">
      <rect x="1610" y="130" width="250" height="500" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="1610" y="130" width="8" height="500" rx="4" fill="#1d4ed8"/>
    </g>
    <text x="1635" y="162" class="tag-lbl" fill="#1d4ed8">Projection Head</text>
    <text x="1635" y="188" class="block-title">Visual Feature Head</text>
    <line x1="1635" y1="202" x2="1835" y2="202" stroke="#f1f5f9" stroke-width="2"/>
        <text x="1635" y="232" class="block-desc">• Global Average Pooling 2D</text><text x="1635" y="258" class="block-desc">  (Converts spatial map to 256-d)</text><text x="1635" y="284" class="block-desc">• Dense Layer (256 neurons)</text><text x="1635" y="310" class="block-desc">• Batch Normalization + ReLU</text><text x="1635" y="336" class="block-desc">• Dropout (rate = 0.40)</text><text x="1635" y="362" class="block-desc">• Dense Layer (128 neurons)</text><text x="1635" y="388" class="block-desc">───</text><text x="1635" y="414" class="block-desc">Ready for Fusion Stage</text>
    <rect x="1635" y="578" width="200" height="32" rx="8" fill="#1d4ed8"/>
    <text x="1735.0" y="599" text-anchor="middle" class="dim-badge">Output: 128-d Vector</text>
        
  <!-- Bottom info bar -->
  <rect x="60" y="660" width="1800" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="85" y="694" font-size="13.5" font-weight="700" fill="#0f172a">Computational Characteristics of GeriatricNet:</text>
  <text x="85" y="720" font-size="13" font-weight="500" fill="#475569">• Total Parameters: 2.1M (~8% of ResNet50's 24.9M)  |  • Saved Size: 8.6 MB  |  • CPU Inference Latency: 8.4 ms  |  • Validation Accuracy: 91.5%</text>
  <text x="1835" y="708" text-anchor="end" font-size="13" font-weight="700" fill="#0284c7">Canva-Ready Vector Diagram • NeuroVision / GeroFusion Net</text>
</svg>
